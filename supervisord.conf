[supervisord]
nodaemon=false
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

; ──────────────────────────────────────────────
; 1. Python MCP server (SSE transport, port 8000)
; ──────────────────────────────────────────────
[program:mcp-server]
command=python server.py
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ──────────────────────────────────────────────
; 2. Node.js API bridge (Express, port 3001)
;    Depends on the MCP server being ready — give
;    it a few seconds head-start via startsecs.
; ──────────────────────────────────────────────
[program:api-server]
command=node frontend/api-server.js
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0


